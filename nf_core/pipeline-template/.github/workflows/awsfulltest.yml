name: nf-core AWS full size tests
# This workflow is triggered on PRs opened against the main/master branch.
# It can be additionally triggered manually with GitHub actions workflow dispatch button.
# It runs the -profile 'test_full' on AWS batch

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]

jobs:
  run-platform:
    name: Run AWS full tests
    # run only if the PR is approved by at least 2 reviewers and against the master/main branch or manually triggered
    if: github.repository == '{{ name }}' && github.event.review.state == 'approved' && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set revision variable
        id: revision
        run: |
          echo "revision={%- raw -%}${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && github.sha || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-tower-launch@9856f1ae20c8b02884733f79b7cd0e3ea5d2bdab # v2.4.0
        # TODO nf-core: You can customise AWS full pipeline tests as required
        # Add full size test data (but still relatively small datasets for few samples)
        # on the `test_full.config` test runs with only one set of parameters
        with:
          workspace_id: ${{ vars.TOWER_WORKSPACE_ID }}
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute_env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ steps.revision.outputs.revision }}
          workdir: s3://${{ vars.AWS_S3_BUCKET }}{% endraw %}/work/{{ short_name }}/{% raw %}work-${{ steps.revision.outputs.revision }}{% endraw %}
          nextflow_config: |
            plugins {
              id 'nf-slack@0.5.0'
              id 'nf-schema@2.7.2'
              // Experimental: enable after committing a baseline from a successful test_full run.
              // id 'nf-snapshot@0.1.0'
            }
            // Experimental output validation. See docs/usage.md before enabling.
            // snapshot {
            //   enabled  = true
            //   file     = 'tests/snapshots/test_full.json'
            //   ignore   = ['pipeline_info/**']
            //   nameOnly = [
            //     '**/*.html', '**/*.log', '**/*.pdf', '**/*.png', '**/*.svg', '**/*.parquet', '**/*.json',
            //     'multiqc/multiqc_data/llms-full.txt', 'multiqc/multiqc_data/multiqc_sources.txt'
            //   ]
            // }
            slack {
              enabled = true
              bot {
                token = '{% raw %}${{ secrets.NFSLACK_BOT_TOKEN }}{% endraw %}'
                channel = '{{ short_name }}'
              }
              onStart {
                enabled = false
              }
              onComplete {
                message = ':white_check_mark: *{{ short_name }}/test_full* completed successfully! :tada:'
              }
              onError {
                message = ':x: *{{ short_name }}/test_full* failed :crying_cat_face:'
              }
            }
          parameters: |
            {
              "outdir": "s3://{% raw %}${{ vars.AWS_S3_BUCKET }}{% endraw %}/{{ short_name }}/{% raw %}results-${{ steps.revision.outputs.revision }}{% endraw %}"
            }
          profiles: test_full

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Seqera Platform debug log file
          path: |
            tower_action_*.log
            tower_action_*.json
