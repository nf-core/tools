name: nf-core AWS test
# This workflow can be triggered manually with the GitHub actions workflow dispatch button.
# It runs the -profile 'test' on AWS batch

on:
  workflow_dispatch:
jobs:
  run-platform:
    name: Run AWS tests
    if: github.repository == '{{ name }}'
    runs-on: ubuntu-latest
    steps:
      - name: Launch workflow via Seqera Platform {%- raw %}
        uses: seqeralabs/action-seqera-launch@v1
        with:
          wait: none
          # nf-core TODO: uncomment the line below if your pipeline uses the v2 parser
          # syntax-parser: v2
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ github.sha }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}{% endraw %}/work/{{ short_name }}/{% raw %}work-${{ github.sha }}{% endraw %}
          parameters: |
            {
              "outdir": "s3://{% raw %}${{ vars.AWS_S3_BUCKET }}{% endraw %}/{{ short_name }}/{% raw %}results-test-${{ github.sha }}{% endraw %}"
            }
          profiles: test
