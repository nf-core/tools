name: extractdiamondreads
description: Use a custom script to extract reads for a specified taxonomic ID from DIAMOND results
keywords:
  - taxid
  - diamond
  - tsv
  - fastq
  - extract_reads
input:
  - taxid:
      type: integer
      description: A taxonomic ID to extract the reads for
  - evalue_threshold:
      type: ["number", "integer"]
      description: An e-value threshold to filter the diamond classification result
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - tsv:
        type: file
        description: Tab-separated DIAMOND classification result file
        pattern: "*.tsv"
    - fastq:
        type: file
        description: Input FASTQ files
        pattern: "*.fastq.gz"
output:
  extracted_diamond_reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: FASTQ files containing the extracted reads for the selected taxid
          pattern: "*.fastq.gz"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed -e 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pigz:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - "pigz --version 2>&1 | sed -e 's/pigz //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
