name: Update Textual snapshots from a comment
on:
  issue_comment:
    types: [created] # Add "@nf-core-bot update textual snapshots" as a PR comment to trigger this workflow.

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      # Permissions for the branch-deploy action, as documented here:
      #  https://github.com/github/branch-deploy#how-does-it-work-
      pull-requests: write # Required for commenting on PRs
      deployments: write # Required for updating deployment statuses
      contents: write # Required for reading/writing the lock file
      checks: read # Required for checking if the CI checks have passed in order to deploy the PR
      statuses: read # Required for checking if all commit statuses are "success" in order to deploy the PR
    steps:
      - name: branch-deploy
        id: branch-deploy
        uses: github/branch-deploy@f0984057ffe1aa340aa017b6eafb894310aed88e # v12.0.0
        with:
          trigger: "@nf-core-bot update textual snapshots"
          reaction: "eyes"
          stable_branch: "dev"
          update_branch: "disabled" # do not require the branch to be up-to-date
          checks: "required" # don't proceed if any required checks failed
          environment: "update_textual_snapshots"

      # Use the @nf-core-bot token to check out so we can push later
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          token: ${{ secrets.nf_core_bot_auth_token }}

      # indication that the command is running
      - name: React on comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # Action runs on the issue comment, so we don't get the PR by default
      # Use the gh cli to check out the PR
      - name: Checkout Pull Request
        if: steps.branch-deploy.outputs.continue == 'true'
        run: |
          gh pr checkout ${{ github.event.issue.number }}

          # Verify that the commit sha matches what we expect, just in
          # case a new commit was pushed after the workflow was triggered.
          if [[ $(git log -1 --format=%H) != $EXPECTED_SHA ]]; then
             echo "::error title=bad-commit-id::Expected the commit ID of the pull request to be $EXPECTED_SHA but found $(git log -1 --format=%H)."
             exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
          EXPECTED_SHA: ${{ steps.branch-deploy.outputs.sha }}

      # Install dependencies and run pytest
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.branch-deploy.outputs.continue == 'true'
        run: uv sync

      - name: Run pytest to update snapshots
        id: pytest
        if: steps.branch-deploy.outputs.continue == 'true'
        run: |
          uv run python -m pytest tests/pipelines/test_create_app.py --snapshot-update --color=yes --durations=0 -n logical
        continue-on-error: true

      # indication that the run has finished
      - name: react if finished succesfully
        if: steps.branch-deploy.outputs.continue == 'true' && steps.pytest.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: "+1"

      - name: Commit & push changes
        id: commit-and-push
        if: steps.branch-deploy.outputs.continue == 'true' && steps.pytest.outcome == 'success'
        run: |
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git config push.default upstream
          git add .
          git status
          git commit -m "[automated] Update Textual snapshots"
          git push

      - name: react if snapshots were updated
        id: react-if-updated
        if: steps.branch-deploy.outputs.continue == 'true' && steps.commit-and-push.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: hooray

      - name: react if snapshots were not updated
        if: steps.branch-deploy.outputs.continue == 'true' && steps.commit-and-push.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: confused

      - name: comment if snapshots were not updated
        if: steps.branch-deploy.outputs.continue == 'true' && steps.commit-and-push.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            @${{ github.actor }} I tried to update the snapshots, but it didn't work. Please update them manually.
