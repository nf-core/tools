name: Update Textual snapshots from a comment
on:
  issue_comment:
    types: [created] # Add "@nf-core-bot update textual snapshots" as a PR comment to trigger this workflow.

# Same trust boundary as the reusable fix-linting workflow in nf-core/actions:
#   acknowledge       - gates the run on the comment and on who wrote it. Never checks out the pull request.
#   update-snapshots  - runs the pull request's code. No secrets, read-only token, no persisted credential.
#   commit-snapshots  - validates the snapshots, commits and pushes them with the bot token. Never runs pull
#                       request code.
permissions: {}

env:
  SNAPSHOT_PATH: tests/pipelines/__snapshots__/test_create_app

jobs:
  acknowledge:
    name: Check trigger and permissions
    # issue_comment fires for issues too; only pull requests carry `issue.pull_request`.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@nf-core-bot update textual snapshots')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      head-sha: ${{ steps.check.outputs.head_sha }}
    steps:
      # The bot pushes to the pull request head branch, so its author or a write collaborator gains nothing they
      # couldn't do themselves. A protected head branch blocks even its author, so only admins are trusted there.
      - name: Require write access, or admin when the head branch is protected
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>&1)"; then
            echo "::error::Could not read pull request #${PR_NUMBER}, so the request is denied. gh said: ${pr_json}"
            exit 1
          fi
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          if [ -z "$head_repo" ]; then
            echo "::error::The pull request's head repository is gone (for example a deleted fork), so the request is denied."
            exit 1
          fi
          echo "head_sha=$(jq -r '.head.sha' <<<"$pr_json")" >> "$GITHUB_OUTPUT"

          if ! branch_json="$(gh api "repos/${head_repo}/branches/${head_ref}" 2>&1)"; then
            echo "::error::Could not read branch protection for '${head_repo}:${head_ref}', so the request is denied. gh said: ${branch_json}"
            exit 1
          fi
          protected="$(jq -r '.protected' <<<"$branch_json")"

          if [ "$protected" != "true" ] && [ "$COMMENTER" = "$PR_AUTHOR" ]; then
            echo "Commenter is the pull request author, and the head branch is not protected."
            exit 0
          fi

          if ! permission_json="$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" 2>&1)"; then
            echo "::error::Could not determine ${COMMENTER}'s permission on ${REPO}, so the request is denied. gh said: ${permission_json}"
            exit 1
          fi
          permission="$(jq -r .permission <<<"$permission_json")"
          echo "Commenter '${COMMENTER}' has repository permission: ${permission}. Head branch protected: ${protected}."

          if [ "$protected" = "true" ]; then
            [ "$permission" = "admin" ] && exit 0
            echo "::error::The head branch '${head_ref}' is protected, so updating its snapshots needs admin access to ${REPO}."
            exit 1
          fi
          case "$permission" in
            admin|write) exit 0 ;;
            *)
              echo "::error::${COMMENTER} is not the pull request author and does not have write access to ${REPO}."
              exit 1
              ;;
          esac

      - name: React to the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes'

  update-snapshots:
    needs: [acknowledge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs the pull request's Python package and tests: no secret is referenced in this job.
    permissions:
      contents: read
    steps:
      # The exact commit the permission check saw, so the commit job can tell if the pull request moved since.
      - name: Checkout Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.acknowledge.outputs.head-sha }}
          persist-credentials: false

      # Install dependencies and run pytest
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # issue_comment runs only get read-only access to the default branch's cache, so restore it but don't try to save.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync

      - name: Run pytest to update snapshots
        id: pytest
        run: |
          uv run python -m pytest tests/pipelines/test_create_app.py --snapshot-update --color=yes --durations=0 -n logical

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: textual-snapshots
          path: ${{ env.SNAPSHOT_PATH }}/
          retention-days: 1
          if-no-files-found: error

  commit-snapshots:
    needs: [acknowledge, update-snapshots]
    runs-on: ubuntu-latest
    # Also runs when the snapshot job failed, to report it.
    if: always() && needs.acknowledge.result == 'success'
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: update-textual-snapshots-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.update-snapshots.result == 'success'
        with:
          persist-credentials: false

      # `gh pr checkout` sets up the push target, including fork branches; the bot token is only added at push time.
      - name: Checkout exact pull request head
        if: needs.update-snapshots.result == 'success'
        env:
          EXPECTED_HEAD_SHA: ${{ needs.acknowledge.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::The pull request head changed after the snapshots were generated. Comment again to regenerate them."
            exit 1
          fi

      # Outside the work tree: the artifact was written by a job that ran pull request code.
      - name: Download snapshot artifact
        if: needs.update-snapshots.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: textual-snapshots
          path: ${{ runner.temp }}/snapshots

      # Only regular, reasonably sized SVG files named after a test make it into the commit. The directory is
      # replaced as a whole, so snapshots that pytest removed are removed here too.
      - name: Validate and copy snapshots
        if: needs.update-snapshots.result == 'success'
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/snapshots
        run: |
          find "$DOWNLOAD_DIR" -mindepth 1 -print0 | while IFS= read -r -d '' f; do
            name="${f#"$DOWNLOAD_DIR"/}"
            if [ ! -f "$f" ] || [ -L "$f" ] || ! [[ "$name" =~ ^test_[a-z0-9_]+\.svg$ ]]; then
              echo "::error::Unexpected file in snapshot artifact: $name"
              exit 1
            fi
            if [ "$(stat -c %s "$f")" -gt 1048576 ] || ! head -c 256 "$f" | grep -q '<svg'; then
              echo "::error::$name is not a valid snapshot file"
              exit 1
            fi
          done
          rm -rf "$SNAPSHOT_PATH"
          mkdir -p "$SNAPSHOT_PATH"
          cp "$DOWNLOAD_DIR"/*.svg "$SNAPSHOT_PATH/"

      - name: Commit & push changes
        id: commit-and-push
        if: needs.update-snapshots.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
        run: |
          git add --all "$SNAPSHOT_PATH"
          git diff --staged --quiet && echo "No snapshot changes to commit" && exit 0
          gh auth setup-git
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git config push.default upstream
          # Repository-supplied hooks or signing config must not run in this credentialed job.
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit --no-verify -m "[automated] Update Textual snapshots"
          git -c core.hooksPath=/dev/null push --no-verify

      - name: react if snapshots were updated
        if: steps.commit-and-push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='hooray'

      - name: react and comment if snapshots were not updated
        if: always() && (failure() || needs.update-snapshots.result != 'success')
        env:
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content='confused'
          gh pr comment "$PR_NUMBER" --body "@${ACTOR} I tried to update the snapshots, but it didn't work. Please update them manually.
          See [CI log](${RUN_URL}) for more details."
