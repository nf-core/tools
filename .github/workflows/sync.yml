name: Sync template
on:
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      testpipeline:
        type: boolean
        description: Only run on nf-core/testpipeline?
        required: true
      force_pr:
        description: "Force a PR to be created"
        type: boolean
        default: false
      pipeline:
        description: "Pipeline to sync"
        type: string
        default: "all"
      debug:
        description: "Enable debug/verbose mode (true or false)"
        type: boolean
        default: false
      blog_post:
        description: "link to release blogpost"
        type: string
        required: true

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pushes and pull requests use the nf-core-bot token; the default token only needs to read this repo.
permissions:
  contents: read

jobs:
  get-pipelines:
    runs-on: "ubuntu-latest"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Inputs and the fetched pipeline list go through env and jq, never into the script text, so a value can't run
      # as code in this workflow, which holds the bot token.
      - id: set-matrix
        env:
          TESTPIPELINE: ${{ inputs.testpipeline }}
          PIPELINE: ${{ inputs.pipeline }}
        run: |
          if [ "$TESTPIPELINE" == "true" ]; then
            echo '{"pipeline":["testpipeline"]}' > pipeline_names.json
          else
            curl -fsSL -o all_pipelines.json https://nf-co.re/pipeline_names.json
            if [ "$PIPELINE" != "all" ] && [ -n "$PIPELINE" ]; then
              # check if the pipeline exists
              if ! jq -e --arg p "$PIPELINE" '.pipeline | index($p)' all_pipelines.json > /dev/null; then
                echo "::error::Pipeline '$PIPELINE' does not exist"
                exit 1
              fi
              jq -c --arg p "$PIPELINE" '{pipeline: [$p]}' all_pipelines.json > pipeline_names.json
            else
              jq -c '{pipeline: .pipeline}' all_pipelines.json > pipeline_names.json
            fi
          fi
          # Pipeline names end up in paths and repository names, so only allow plain names.
          if ! jq -e '.pipeline | length > 0 and all(test("^[a-z0-9_-]+$"))' pipeline_names.json > /dev/null; then
            echo "::error::Unexpected pipeline name in: $(cat pipeline_names.json)"
            exit 1
          fi
          echo "matrix=$(jq -c . pipeline_names.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: get-pipelines
    runs-on:
      - runs-on=${{ github.run_id }}-sync
      - runner=4cpu-linux-x64
    strategy:
      matrix: ${{fromJson(needs.get-pipelines.outputs.matrix)}}
      fail-fast: false
    env:
      PIPELINE: ${{ matrix.pipeline }}
      BLOG_POST: ${{ inputs.blog_post }}
      VERBOSE: ${{ inputs.debug && '--verbose' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        name: Check out nf-core/tools
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      # The bot token stays in this checkout's git config: `nf-core pipelines sync` pushes with plain `git push`. The only
      # artifact this job uploads is the sync log, never the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        name: Check out nf-core/${{ matrix.pipeline }}
        with:
          repository: nf-core/${{ matrix.pipeline }}
          ref: dev
          token: ${{ secrets.nf_core_bot_auth_token }}
          path: nf-core/${{ matrix.pipeline }}
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install python dependencies
        run: uv sync

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "25.10.4"

      - name: Run synchronisation
        id: sync
        if: github.repository == 'nf-core/tools'
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
        run: |
          git config --global user.email "core@nf-co.re"
          git config --global user.name "nf-core-bot"
          # $VERBOSE is unquoted on purpose: when empty, it must add no argument at all.
          # shellcheck disable=SC2086
          uv run nf-core --log-file "sync_log_${PIPELINE}.txt" \
            $VERBOSE \
            pipelines sync -d "nf-core/${PIPELINE}" \
            --from-branch dev \
            --pull-request \
            --username nf-core-bot \
            --github-repository "nf-core/${PIPELINE}" \
            --blog-post "$BLOG_POST"

      - name: Install newer Nextflow (retry fallback)
        if: github.repository == 'nf-core/tools' && steps.sync.outcome == 'failure'
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "26.04.6"

      - name: Retry synchronisation with newer Nextflow
        if: github.repository == 'nf-core/tools' && steps.sync.outcome == 'failure'
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
        run: |
          git config --global user.email "core@nf-co.re"
          git config --global user.name "nf-core-bot"
          # $VERBOSE is unquoted on purpose: when empty, it must add no argument at all.
          # shellcheck disable=SC2086
          uv run nf-core --log-file "sync_log_${PIPELINE}.txt" \
            $VERBOSE \
            pipelines sync -d "nf-core/${PIPELINE}" \
            --from-branch dev \
            --pull-request \
            --username nf-core-bot \
            --github-repository "nf-core/${PIPELINE}" \
            --blog-post "$BLOG_POST"

      - name: Upload sync log file artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync_log_${{ matrix.pipeline }}
          path: sync_log_${{ matrix.pipeline }}.txt
