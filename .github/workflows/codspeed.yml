name: CodSpeed benchmarks

on:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/codspeed.yml
      - benchmarks/**
      - nf_core/**/*.py
  pull_request:
    paths:
      - .github/workflows/codspeed.yml
      - benchmarks/**
      - nf_core/**/*.py
  workflow_dispatch:

# Cancel if a newer run with the same workflow name is queued
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  startup-benchmarks:
    name: Run benchmarks
    runs-on: runs-on=${{ github.run_id }}-codspeed/family=c8a.xlarge/spot=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check out source-code repository
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@c66f1bfa2dc817ae23f4b34eaa26fa5f1453ca71 # v3
        with:
          version: "25.10.4"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # Clone nf-core/modules into the local cache here, while network is
      # available. The module benchmarks then run with `--no-pull`, so no
      # round pays for a `git fetch`.
      - name: Warm nf-core/modules cache
        run: uv run python -c "from nf_core.modules.modules_repo import ModulesRepo; ModulesRepo()"

      # Every benchmark runs the `nf-core` CLI in a subprocess, which "simulation" mode can't see
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          run: uv run pytest benchmarks/ --codspeed
